<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Hotel Management System</title>
    <!-- Relative path within admin_panel folder -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="admin-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <h2>Hotel Admin</h2>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active">⚙️ Web Portal CMS</a>
                <a href="#" class="nav-item">📅 Bookings</a>
                <a href="#" class="nav-item">🛏️ Rooms</a>
                <!-- Navigation back to Public Guest Portal -->
                <a href="../index.html" class="nav-item exit-link">🌐 View Website</a>
            </nav>
        </aside>

        <!-- Main Workspace -->
        <main class="main-content">
            <header class="top-bar">
                <h1>Website Content Management</h1>
                <p>Update banners, services, and hotel information.</p>
            </header>

            <div class="card form-card">
                <h3>Update Hero Banner</h3>
                
                <form id="banner-form">
                    <div class="form-group">
                        <label for="headline">Headline Title</label>
                        <input type="text" id="headline" class="form-control" placeholder="e.g. Experience Luxury & Serenity" required>
                    </div>

                    <div class="form-group">
                        <label for="subtitle">Subtitle</label>
                        <input type="text" id="subtitle" class="form-control" placeholder="e.g. Book your stay at the finest hotel" required>
                    </div>

                    <div class="form-group">
                        <label for="banner-url">Banner Image URL</label>
                        <input type="url" id="banner-url" class="form-control" placeholder="https://..." required>
                    </div>

                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>
        </main>
    </div>

    <!-- Admin Script -->
    <script src="assets/js/admin.js"></script>
</body>
</html>

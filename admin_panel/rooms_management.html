<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Rooms - Hotel Admin</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="admin-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <h2>Hotel Admin</h2>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">📊 Dashboard</a>
                <a href="cms.html" class="nav-item">⚙️ Web Portal CMS</a>
                <a href="bookings.html" class="nav-item">📅 Bookings</a>
                <a href="rooms_management.html" class="nav-item active">🛏️ Rooms</a>
                <a href="../index.html" class="nav-item exit-link">🌐 View Website</a>
            </nav>
        </aside>
        <!-- Main Workspace -->
        <main class="main-content">
            <header class="top-bar flex-between">
                <div>
                    <h1>Room Management</h1>
                    <p>Add, update, or remove hotel room listings.</p>
                </div>
                <button id="open-room-modal" class="btn btn-primary">+ Add New Room</button>
            </header>

            <!-- Rooms Data Table -->
            <div class="card table-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Room Name / No.</th>
                            <th>Type</th>
                            <th>Price / Night</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="rooms-table-body">
                        <!-- Populated by assets/js/rooms.js -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal Form for Adding Rooms -->
    <div id="room-modal" class="modal">
        <div class="modal-content card">
            <div class="modal-header">
                <h3>Add New Room</h3>
                <span id="close-modal" class="close-btn">&times;</span>
            </div>
            
            <form id="add-room-form">
                <div class="form-group">
                    <label for="room-number">Room Number / Name</label>
                    <input type="text" id="room-number" class="form-control" placeholder="e.g. Room 101 or Executive Suite" required>
                </div>

                <div class="form-group">
                    <label for="room-type">Category / Type</label>
                    <select id="room-type" class="form-control" required>
                        <option value="Single">Single Room</option>
                        <option value="Double">Double Room</option>
                        <option value="Deluxe">Deluxe Ocean View</option>
                        <option value="Suite">Presidential Suite</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="room-price">Price Per Night ($)</label>
                    <input type="number" id="room-price" class="form-control" placeholder="150" min="1" required>
                </div>

                <div class="form-group">
                    <label for="room-image">Image URL</label>
                    <input type="url" id="room-image" class="form-control" placeholder="https://..." required>
                </div>

                <div class="form-actions">
                    <button type="button" id="cancel-modal" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Room</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Page Specific Script -->
    <script src="assets/js/rooms.js"></script>
</body>
</html>
